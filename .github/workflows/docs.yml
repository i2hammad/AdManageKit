name: Deploy API Documentation

# The published KDoc is generated from source, so anything that changes a doc
# comment changes the site. Deploying only on release meant a KDoc correction sat
# unpublished until the next version shipped - and the live site kept serving text
# the source no longer said. Pushes to main that touch documented source (or the
# Dokka configuration) now deploy as well.
#
# `paths` applies only to the push trigger; release and workflow_dispatch are
# unaffected by it and continue to deploy unconditionally.
on:
  # Deploy on push to main when documented source or Dokka config changes
  push:
    branches: [main]
    paths:
      - "**/src/main/**"
      - "build.gradle.kts"
      - "*/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/docs.yml"
  # Deploy on release
  release:
    types: [published]
  # Also allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate API Documentation
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/dokka/html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
