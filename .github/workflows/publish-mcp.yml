name: Publish MCP Server

# The MCP server bundles docs/, wiki/ and README.md into its npm tarball at publish
# time (scripts/bundle-docs.js), so a documentation change only reaches consumers
# once the package is republished. Publishing therefore runs automatically whenever
# bundled content changes on main - not just on an explicit mcp-v* tag.
#
# npm refuses to overwrite an existing version, so the version is resolved at
# publish time (see "Resolve publish version"): an explicit bump in package.json
# wins, otherwise the patch is incremented from whatever is currently on npm. The
# resolved version is applied in the runner only and never committed back, so this
# workflow cannot trigger itself.

# Note: GitHub ANDs `paths` with the ref filters, so it applies to the mcp-v* tag
# trigger too. In practice that is fine - an mcp-v* tag is cut on a commit that
# bumps mcp-server/package.json, which matches mcp-server/** - and
# workflow_dispatch ignores path filters entirely if a forced publish is ever needed.
#
# Authentication is npm Trusted Publishing (OIDC), not a long-lived token. The
# runner mints a short-lived credential from its GitHub identity, which is why
# the job needs `id-token: write` and why no NPM_TOKEN appears below. This
# replaces an automation token that expired on npm's schedule and failed with a
# misleading `E404 Not Found - PUT` (npm masks unauthorized publishes as 404 so
# it does not leak package existence) - the second credential outage in as many
# quarters. Nothing expires now, so there is nothing to rotate.
#
# Two requirements come with it:
#   - npm >= 11.5.1, hence the explicit `npm install -g npm@latest`. The Node 22
#     runner image ships npm 10.x, which has no OIDC support at all.
#   - a trusted publisher configured on npmjs.com for admanagekit-mcp-server,
#     pinned to this repository AND this workflow's filename (publish-mcp.yml).
#     Renaming this file breaks publishing until the setting is updated to match.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wiki/**"
      - "README.md"
      - "mcp-server/**"
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required for Trusted Publishing: lets the runner mint the OIDC token npm
  # exchanges for a short-lived publish credential.
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.js
          test -d content/docs
          echo "Build verified successfully"

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-server-build
          path: |
            mcp-server/dist/
            mcp-server/content/
            mcp-server/package.json

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      # Deliberately NO `registry-url`. Setting it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and export NODE_AUTH_TOKEN as the placeholder `XXXXX-XXXXX-XXXXX-XXXXX`.
      # npm then sees a credential, never falls through to OIDC, and sends that
      # dummy token to the registry - which answers `E404 Not Found - PUT`,
      # indistinguishable from the expired-token failure this was meant to fix.
      # Omitting it leaves npm on its default registry (registry.npmjs.org, and
      # package.json sets no publishConfig) with no .npmrc auth line, which is
      # what lets Trusted Publishing engage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner image ships npm 10.x, which predates OIDC entirely. Trusted
      # Publishing needs >= 11.5.1, so upgrade before anything touches the registry.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      # `npm publish` runs the prepublishOnly script, which re-runs `tsc` and
      # bundle-docs. That needs node_modules in *this* job — downloading the
      # build job's artifact is not enough, and without an install the publish
      # fails with TS2307 "Cannot find module" for every import.
      - run: npm ci

      # Pick the version to publish. An explicit bump in package.json always wins,
      # so a deliberate minor/major release works as before. Otherwise the patch is
      # incremented from the newest version on npm, which is what makes unattended
      # docs-triggered publishes possible: republishing an unchanged version is a
      # hard 403 from the registry ("You cannot publish over the previously
      # published versions").
      # `npm view` is an unauthenticated read of a public package, so this step
      # needs no credential of its own.
      - name: Resolve publish version
        id: version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          REPO=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG" version 2>/dev/null || echo "0.0.0")
          echo "package=$PKG repo=$REPO published=$PUBLISHED"

          TARGET=$(REPO="$REPO" PUBLISHED="$PUBLISHED" node -e '
            const parse = v => v.split("-")[0].split(".").map(Number);
            const [aM,am,ap] = parse(process.env.REPO);
            const [bM,bm,bp] = parse(process.env.PUBLISHED);
            const repoIsNewer =
              aM > bM || (aM === bM && (am > bm || (am === bm && ap > bp)));
            console.log(repoIsNewer
              ? process.env.REPO
              : [bM, bm, bp + 1].join("."));
          ')

          echo "Publishing $PKG@$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          # Applied in the runner only. Not committed back to main, so this
          # workflow can never re-trigger itself.
          npm version "$TARGET" --no-git-tag-version --allow-same-version

      # A stray credential silently disables OIDC and the registry reports it as
      # a bare 404, which reads exactly like an expired token - so assert the
      # environment is clean while the cause is still obvious.
      - name: Assert no credential is shadowing OIDC
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm will use it instead of OIDC and publishing will fail with a misleading 404."
            exit 1
          fi
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ./.npmrc; do
            if [ -f "$f" ] && grep -q "_authToken" "$f"; then
              echo "::error::$f contains an _authToken line, which shadows OIDC."
              exit 1
            fi
          done
          echo "No token present; Trusted Publishing can proceed."

      # No NODE_AUTH_TOKEN: npm exchanges the runner's OIDC identity for a
      # short-lived credential. Setting a token here would take precedence over
      # OIDC and reintroduce exactly the expiry that broke this workflow.
      # Provenance attestation is generated automatically under Trusted Publishing.
      - run: npm publish --access public

      - name: Summary
        run: |
          echo "Published ${{ steps.version.outputs.target }} to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository package.json still reads $(node -p "require('./package.json').version" || true) in git;" >> "$GITHUB_STEP_SUMMARY"
          echo "the published version is resolved at publish time and not committed back." >> "$GITHUB_STEP_SUMMARY"
